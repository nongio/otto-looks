# Focus: a warm pink and blue gradient with Otto's Cross pad drawn over it:
# small crosses, a serif title, the date up the left edge and a note, all in
# light ink (#f4efe8). Light windows, a blue accent, the dock down the left
# edge.

[look]
name = "Focus"
version = 1
author = "nongio"
description = "Small crosses in light ink over a warm pink and blue gradient. The crosses are Otto's Cross pad widget, drawn by ewwii."

[wallpaper]
title = "Focus"
author = "Riccardo Canalicchio"
source = "https://github.com/nongio/otto-looks/tree/main/looks/focus"
licence = "MIT"
url = "wallpaper.png"

# WhiteSur ships as source only: no release files and no distribution
# packages, so it comes from the tagged source through the theme's own
# installer, into the user's icons.
[icons]
theme = "WhiteSur"
author = "Vince Liu"
source = "https://github.com/vinceliuice/WhiteSur-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/WhiteSur-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "406c9cd59705583f1754b0eaca96cc48bafda042b88ef143f16d8ae1820ecd95"
build = "./install.sh -d \"$DEST\""

# Black pointer with a white rim, clear on the orange and on light windows.
# v1.0.0-alpha1 is the only tagged release; its built theme, pinned. Notwaita
# is ful1e5's build of donut2's Notwaita, drawn after GNOME's Adwaita, and
# carries Adwaita's licence: LGPL-3.0 or CC BY-SA 3.0 US, the user's choice.
[cursors]
theme = "MacTahoe-cursors"
author = "Vince Liu"
source = "https://github.com/vinceliuice/MacTahoe-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/MacTahoe-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "6330369e9e10a28cfc8da598ebf63a7204be705403519963ff84e1cb84719d35"
build = "dest=\"$DEST\" ./cursors/install.sh"

[settings]
background_color = "#C2520A"
cursor_size = 32
theme_scheme = "Light"
accent_color = "#087BFA"
rounded_corners = true
frosting = true
window_controls_side = "left"
show_maximize_button = false

# The dock down the left edge, magnified, untinted.
dock.position = "left"
dock.magnification = true

# Otto's Cross pad over the wallpaper. Drawn by ewwii, with Libertinus Serif
# for the title; without ewwii the setting is kept and nothing is drawn.
desktop.widget = "cross_pad"
