# Supremus: Kazimir Malevich's Suprematism (1915), from the year he showed
# the Black Square: red, black and yellow planes adrift on white. Hung whole
# on its own white, right of centre. Ekaterinburg Museum of Fine Arts.
#
# The painting is in the public domain (the artist died more than 70 years
# ago, and it was made before 1931), so the image is hosted here.

[look]
name = "Supremus"
version = 1
author = "nongio"
description = "Malevich's Suprematist planes on white, 1915."

[wallpaper]
title = "Suprematism"
author = "Kazimir Malevich"
source = "https://commons.wikimedia.org/wiki/File:Suprematism_-_Abstract_Composition_(Malevich,_1915).jpg"
licence = "Public domain"
licence_url = "https://creativecommons.org/publicdomain/mark/1.0/"
url = "wallpaper.jpg"

# WhiteSur ships as source only: no release files and no distribution
# packages, and WhiteSur links into WhiteSur, so it comes from the tagged
# source through the theme's own installer, into the user's icons.
[icons]
theme = "WhiteSur"
author = "Vince Liu"
source = "https://github.com/vinceliuice/WhiteSur-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/WhiteSur-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "406c9cd59705583f1754b0eaca96cc48bafda042b88ef143f16d8ae1820ecd95"
build = "./install.sh -d \"$DEST\""

# MacTahoe's cursors live in its icon theme's source, built in cursors/dist;
# the theme's own installer copies them, light and dark, into DEST.
[cursors]
theme = "MacTahoe-cursors"
author = "Vince Liu"
source = "https://github.com/vinceliuice/MacTahoe-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/MacTahoe-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "6330369e9e10a28cfc8da598ebf63a7204be705403519963ff84e1cb84719d35"
build = "dest=\"$DEST\" ./cursors/install.sh"

[settings]
background_color = "#EFF3F6"
cursor_size = 24
theme_scheme = "Light"
accent_color = "#E04423"   # the red plane
rounded_corners = true
frosting = true
window_controls_side = "left"
show_maximize_button = false

# The dock down the left edge, its icons tinted the painting's yellow plane.
dock.position = "left"
dock.colorize_icons = true
dock.colorize_color = "#D7A70C"
dock.colorize_intensity = 1.0
