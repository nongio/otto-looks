# Deep Field: Webb's first deep field, near-black with a blue cast and one
# violet. Cropped to the cluster core, the blacks pulled toward the chrome's
# ground. From the deep-field rice in otto-rices.

[look]
name = "Deep Field"
version = 1
author = "nongio"
description = "Webb's First Deep Field, near-black and one violet."

[wallpaper]
title = "Webb's First Deep Field (SMACS 0723)"
author = "ESA/Webb, NASA, CSA, STScI"
source = "https://esawebb.org/images/weic2209a/"
licence = "CC BY 4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
attribution = "Webb's First Deep Field (SMACS 0723) by ESA/Webb, NASA, CSA, STScI, CC BY 4.0. Cropped and colour-graded."
url = "wallpaper.jpg"

# WhiteSur ships as source only, so it comes from the tagged source
# through the theme's own installer, into the user's icons.
[icons]
theme = "WhiteSur-dark"
author = "Vince Liu"
source = "https://github.com/vinceliuice/WhiteSur-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/WhiteSur-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "406c9cd59705583f1754b0eaca96cc48bafda042b88ef143f16d8ae1820ecd95"
build = "./install.sh -d \"$DEST\""

[cursors]
theme = "macOS-White"
author = "Abdulkaiz Khatri"
source = "https://github.com/ful1e5/apple_cursor"
licence = "GPL-3.0"
url = "https://github.com/ful1e5/apple_cursor/releases/download/v2.0.1/macOS-White.tar.xz"
sha256 = "3d2f731ade1828d73b19681db9afc62e6f8d059185e870edda64f8bedb783856"

[settings]
background_color = "#07070f"
cursor_size = 24
theme_scheme = "Dark"
accent_color = "#a58cff"
rounded_corners = true
frosting = true
window_controls_side = "left"
show_maximize_button = false

# The dock, as the rice has it: down the right edge, icons tinted.
# Full-strength violet; on a near-black dock a saturated tint can afford it.
dock.position = "right"
dock.size = 0.9
dock.colorize_icons = true
dock.colorize_color = "#a58cff"
dock.colorize_intensity = 1.0
