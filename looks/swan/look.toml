# Swan: Hilma af Klint's The Swan, No. 17 (1915), from the Swan series she
# painted in 1914-15: a disc split into black and colour, on a red ground.
# Cropped to 16:9 around the disc; nothing painted over.
#
# The painting is in the public domain (the artist died more than 70 years
# ago, and it was made before 1931), so the image is hosted here.

[look]
name = "Swan"
version = 1
author = "nongio"
description = "Hilma af Klint's split disc on red, 1915."

[wallpaper]
title = "The Swan, No. 17, Group IX/SUW"
author = "Hilma af Klint"
source = "https://commons.wikimedia.org/wiki/File:Hilma_af_Klint,_1915,_Svanen,_No._17.jpg"
licence = "Public domain"
licence_url = "https://creativecommons.org/publicdomain/mark/1.0/"
url = "wallpaper.jpg"

# WhiteSur ships as source only: no release files and no distribution
# packages, and WhiteSur links into WhiteSur, so it comes from the tagged
# source through the theme's own installer, into the user's icons.
[icons]
theme = "WhiteSur"
author = "Vince Liu"
source = "https://github.com/vinceliuice/WhiteSur-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/WhiteSur-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "406c9cd59705583f1754b0eaca96cc48bafda042b88ef143f16d8ae1820ecd95"
build = "./install.sh -d \"$DEST\""

[cursors]
theme = "macOS"
author = "Abdulkaiz Khatri"
source = "https://github.com/ful1e5/apple_cursor"
licence = "GPL-3.0"
url = "https://github.com/ful1e5/apple_cursor/releases/download/v2.0.1/macOS.tar.xz"
sha256 = "9c6e5e13b068ce51a9e90a9abd6ce232ec7d25d4ceb05aa8ac76efbb99c76762"

[settings]
background_color = "#972C21"
cursor_size = 24
theme_scheme = "Light"
accent_color = "#4F7CC4"   # the blue half of the disc
rounded_corners = true
frosting = true
window_controls_side = "left"
show_maximize_button = false
