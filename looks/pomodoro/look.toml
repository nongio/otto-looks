# Pomodoro: a single tomato, beaded with water, on a flat green field.
# Red against green, nothing else; the accent is the tomato.
#
# The photo is linked, not hosted: the Unsplash Licence lets anyone use it
# but not gather it into a collection of their own, so otto-look fetches it
# from Unsplash, cropped to 16:9 at 3840x2160, and checks it by its sha256.

[look]
name = "Pomodoro"
version = 1
author = "nongio"
description = "One wet tomato on a flat green field."

[wallpaper]
title = "Red round fruit on green surface"
author = "Auguste A"
source = "https://unsplash.com/photos/WQ2WOHw0C7I"
licence = "Unsplash Licence"
licence_url = "https://unsplash.com/license"
url = "https://images.unsplash.com/photo-1605315024122-7fd363c1f7ab?fm=jpg&q=90&w=3840&h=2160&fit=crop"
sha256 = "ac98ad62699e0e107c45b6c96f44fbcc0b4071047a0e52590c7a3d53ac38936b"

# WhiteSur ships as source only, so it comes from the tagged source
# through the theme's own installer, into the user's icons.
[icons]
theme = "WhiteSur"
author = "Vince Liu"
source = "https://github.com/vinceliuice/WhiteSur-icon-theme"
licence = "GPL-3.0"
url = "https://github.com/vinceliuice/WhiteSur-icon-theme/archive/refs/tags/2026-09-10.tar.gz"
sha256 = "406c9cd59705583f1754b0eaca96cc48bafda042b88ef143f16d8ae1820ecd95"
build = "./install.sh -d \"$DEST\""

[cursors]
theme = "macOS"
author = "Abdulkaiz Khatri"
source = "https://github.com/ful1e5/apple_cursor"
licence = "GPL-3.0"
url = "https://github.com/ful1e5/apple_cursor/releases/download/v2.0.1/macOS.tar.xz"
sha256 = "9c6e5e13b068ce51a9e90a9abd6ce232ec7d25d4ceb05aa8ac76efbb99c76762"

[settings]
background_color = "#06B659"
cursor_size = 32
theme_scheme = "Light"
accent_color = "#E0452B"   # the lit side of the tomato
rounded_corners = true
frosting = true
window_controls_side = "left"
show_maximize_button = false
